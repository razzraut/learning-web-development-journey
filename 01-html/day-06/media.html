<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning about Media in HTML</title>
</head>
<body>

    <h1>Different type of media in html file(audio, video, etc):</h1>

   
    <div>
        <h2>Audio:</h2>
        <figure>
            <figcaption>India Fuse Music - a pleasent music</figcaption>
             <audio src="indiaFuse.mp3" controls loop autoplay></audio>
        </figure>
        <h2>Video:</h2>
        <figure>
            <figcaption>Short Animation Video - razz </figcaption>
            <video src="rzAnimation.mp4" controls height="200" loop ></video>
        </figure>

        <h2>svg file:</h2>
        <figure>
            <figcaption>A svg file - circle</figcaption>
            <img src="circle.svg" alt="circle icon">
        </figure>
    </div>



    <div>
        <h2>Embedded yt link using iframe:</h2>     
        <iframe width="320" height="160" src="https://www.youtube.com/embed/cdIs7VujZqs?si=0BIDCnHXrNAZizdr" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  
</body>
</html>
