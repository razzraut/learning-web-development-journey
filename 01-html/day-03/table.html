<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning about HTML Table</title>
</head>
<body>


    <h2>Preview of HTML Table</h2>
    <table border="2"
         width="250"
         height="150"
         bordercolor="blue" 
         bgcolor="sky blue" 
         cellspacing="2" 
         cellpadding="5" >
        <caption>Student Table</caption>
        <tr >
            <th>Roll No.</th>
            <th>Name</th>
            <th>Address</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Razz</td>
            <td>Dhanusa</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ram</td>
            <td>Mohatari</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Rani</td>
            <td>KTM</td>
        </tr>
       
    </table>

</body>
</html>
